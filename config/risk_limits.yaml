# 运行参数 —— real_run.py 启动时读取本文件，改完需重启进程才生效。
# 2026-10-19：模拟盘亏损主要来自 1 分钟假突破和 30 分钟超时离场（手续费大于价格波动）。
# 做多突破必须顺着 15 分钟趋势；关掉到点平仓，让止损、止盈和反向信号负责离场。
risk_limits:
  max_risk_per_trade: 0.01      # R1 单笔风险 ≤ 净值 1%
  max_position_pct: 0.20        # R2 单标的市值 ≤ 净值 20%
  max_drawdown_halt: 0.10       # R3 回撤 ≥ 10% 全局熔断（人工解锁）
  event_window_minutes: 60      # R4 重大事件公布前 N 分钟进入降仓窗口
  event_window_scale: 0.5       #    窗口内新开仓数量 × 0.5
  cooldown_minutes: 10          # R5 同标的交易冷却期

strategy:
  w_llm: 0.20                   # LLM 情绪权重（新闻滞后，只作辅助）
  w_quant: 0.25                 # 量化常规信号权重（辅助确认）
  w_breakout: 0.55              # 技术突破信号权重（满强度可单独触发开仓）
  w_flow: 0.50                  # 资金流信号权重（大额异常可单独触发）
  entry_threshold: 0.35         # 开仓信号阈值
  conflict_threshold: 0.4       # 信号矛盾判定阈值
  sentiment_ttl_minutes: 90     # 新闻情绪有效期
  signal_ttl_minutes: 15        # 突破/资金流信号有效期（线性衰减）
  stop_loss_pct: 0.007          # 止损线 0.7%（1m 波动尺度 + 0.2% 往返费用的现实匹配）
  take_profit_pct: 0.010        # 硬止盈 1.0% 兜顶；主要靠下面两段动态落袋
  time_stop_minutes: 20         # 超时兜底（20分钟没走出行情就收回资金）
  min_decision_interval: 5.0    # 同标的两次评估最小间隔（秒）
  trend_filter: true            # 仅 15 分钟趋势向上时接受做多
  trend_fast: 8                 # 15 分钟快线
  trend_slow: 21                # 15 分钟慢线
  trend_bar_minutes: 15
  follow_flow: true             # 大额流入当作带单人；止损后拉黑，换下一笔流入
  follow_min_strength: 0.45     # 低于该强度的流入不算“大额”，不能当作新带单人
  # 果断止盈三段式：+0.4%保本锁定 → +0.7%跟踪止盈（回撤0.25%即落袋）→ 1.0%硬顶
  breakeven_at: 0.004           # 浮盈达到 +0.4% 后止损线上移到保本位
  breakeven_lock: 0.0015        # 保本位 = 入场价 + 0.15%（覆盖往返费用）
  trail_at: 0.007               # 浮盈达到 +0.7% 后切换为跟踪止盈
  trail_gap: 0.0025             # 跟踪止损距最高价容忍 0.25% 回撤
  # 挂单进场（2026-10-21 回测：V2 -160 → V2M -81，费用 129→94，错过率仅 3/119）
  maker_entries: true           # 进场买单挂限价（maker 费率 0.05%）；离场永远吃单
  # 震荡收割：区间行情里在布林带极端逆向操作。2026-10-21 九天回测否决
  # （V3: -379/338笔，费用反超），保持关闭；如启用需先解决费用与触发质量问题。
  mr_enable: false
  mr_rsi_low: 30
  mr_rsi_high: 70
  mr_retry_seconds: 120         # 逆向单被风控拦后的重试间隔

# 日线趋势引擎（美股虚拟盘主策略，2026-10-24 起）
trend_engine:
  symbol: SPY                   # 标普500 ETF（akshare 美股日线，qfq 前复权）
  sma_window: 200               # 美股经典趋势均线（SPY 25.8年回测分期全正）
  exposure: 0.5                 # 信号开启时的仓位比例（0.5=半仓稳健；1.0=全仓激进）
  initial_cash: 100000          # 虚拟盘起始资金（USD，零佣金+2bp滑点模拟）

# 策略切换（2026-11-17 起）：飞书指令 / H5 按钮手动切换，默认稳健长期定投
strategy_switch:
  default: hybrid               # dca=稳健长期定投 | spec=短期投机 | hybrid=定投+事件投机并行

# 稳健长期定投引擎（周定投 + 回调低吸 + 分批/跟踪止盈）
dca_engine:
  symbol: SPY
  sma_window: 200               # 周定投门禁：收盘低于 SMA200 暂停周定投（回调低吸豁免）
  weekly_amount: 2000           # 每周定投金额（USD）
  weekly_day: 0                 # 定投日（0=周一，按最新已收盘日线日期判断）
  dip_lookback: 20              # 回调识别窗口（近 N 日最高价）
  dip_tiers:                    # 跌幅分级加仓（命中最高档）
    - {drop: 0.05, mult: 1}
    - {drop: 0.10, mult: 2}
    - {drop: 0.15, mult: 3}
  dip_cooldown_days: 5          # 两次低吸最小间隔（自然日）；回调更深时豁免冷却（越跌越买）
  tp_trigger: 0.10              # 浮盈 +10% 触发首次止盈
  tp_fraction: 0.3333           # 首次卖出持仓的 1/3
  trail_pct: 0.08               # 剩余仓位跟踪止盈：距最高点回撤 8% 清仓

# 事件投机引擎（信息流 + 机构资金动向代理；hybrid 下与定投并行，SPY 底仓冻结）
spec_engine:
  symbols: [NVDA, TSLA, AAPL, MSFT, GOOGL, AMZN, META, AMD, AVGO, TSM, NFLX, ORCL, CRM]
  w_news: 0.6                   # 新闻情绪权重
  w_flow: 0.4                   # 资金动向权重
  volume_spike: 2.0             # 放量阈值（折算当日量 / 20日均量）
  sell_score: -0.6              # 综合分 ≤ 此值 → 清仓该标的持仓
  buy_score: 0.35               # 综合分 ≥ 此值 → 具备买入意愿
  buy_tiers:                    # 距 60 日高点跌幅分级（决定买入金额占现金比例）
    - {drop: 0.08, cash_pct: 0.10}
    - {drop: 0.15, cash_pct: 0.15}
    - {drop: 0.25, cash_pct: 0.20}
  watch_hours: 72               # 重大利空后重点观察期（小时）
  max_positions: 3              # 最多同时持有投机标的数（不含冻结的 SPY）
  trade_cooldown_min: 60        # 同标的两次买入最小间隔（分钟）
  news_lookback_min: 40         # 只采纳最近 N 分钟快讯（定时器 20 分钟一轮）
  urgent_lookback_min: 120      # 突发快讯回溯窗口（超常规窗口的重要快讯仍纳入）
  urgent_threshold: 0.60        # 突发紧急度阈值（≥ 即优先评估 + 即时预警 + 触发快车道）
  urgency_strong_score: 0.5     # 情绪分绝对值 ≥ 此值算"强情绪"，计入紧急度
  min_trade_usd: 500            # 单笔最小金额（USD）
  llm_max_calls: 6              # 每轮 LLM 分类最多调用次数（凡有快讯的标的都送判，按优先级）
  llm_strong_score: 0.5         # 强情绪阈值（计入紧急度）
  event_buy_score: 0.6          # 重大利好阈值：LLM 情绪 ≥ 此值才允许无回调小仓位事件买入
  event_buy_cash_pct: 0.08      # 重大利好事件买入动用现金比例（小仓位，防追涨风险）

# 指标突破检测（信息层实时 K 线 → 决策层穿越检测）
breakout:
  donchian_period: 20           # 突破前 N 根 K 线高/低点（海龟入场）
  bollinger_period: 20          # 布林带周期
  bollinger_std: 2.0            # 布林带标准差倍数
  macd_fast: 12                 # MACD 快线
  macd_slow: 26                 # MACD 慢线
  macd_signal: 9                # MACD 信号线
  atr_period: 14                # 突破强度归一化用 ATR 周期
  min_strength: 0.15            # 低于该强度的突破视为噪声不报

# 资金流异常检测（大额流入/抛售行为）
flow:
  window: 30                    # 滚动基线窗口（期，5m粒度=2.5小时）
  min_history: 20               # 预热期数
  direction_z: 2.0              # 失衡度 z-score 触发阈值
  volume_z: 2.0                 # 放量确认阈值（两维确认=真"大额"）
  cooldown_minutes: 15          # 同方向信号冷却
  max_strength_z: 4.0           # z→强度归一化上限
