# 全局配置 —— 实盘模式必须显式改为 live 并理解风险
mode: paper                     # paper | live（live 需二次确认，见 main.py）

account:
  initial_cash: 100000          # 模拟盘初始资金（USDT）

watchlist:
  crypto: ["BTC/USDT", "ETH/USDT"]
  cn_stock: []                  # 阶段2接入 akshare 后启用，如 ["600519", "000001"]

# 信息源（真实试运行：Google News 关键词订阅 + 官方 RSS，均无需 key）
sources:
  - type: google_news           # 美联储/中东/央行/AI大模型/加密 关键词订阅
    enabled: true
  - type: rss
    name: federal-reserve       # 美联储官网（FOMC 声明/纪要）
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    category: fed
    enabled: true
  - type: rss
    name: cointelegraph
    url: https://cointelegraph.com/rss
    category: crypto
    enabled: true
  - type: cryptopanic           # 需要 token 后启用
    token: ""
    enabled: false

market_data:
  crypto:
    provider: mock              # mock | ccxt（阶段2）
    exchange: binance
  cn_stock:
    provider: akshare           # 阶段2

# 实时 K 线流（真实试运行用 REST 主备源，无需 key）
kline:
  provider: rest                # mock | rest（OKX主/Binance备，自动切换）| ccxt
  exchanges: [okx, binance]
  interval: 1m                  # K 线周期
  poll_interval_seconds: 8

# LLM 决策分析器（OpenAI 兼容接口，智谱 GLM / OpenAI / DeepSeek 等均可接入）
# 接入教程与接口说明: docs/LLM接入教程.md | 连通性自检: python scripts/check_llm.py
# 注意端点区别: /api/coding/paas/v4 走编程套餐(Coding Plan)额度；
#              /api/paas/v4 走账户充值余额（编程套餐密钥在该端点会报 429 余额不足）
llm:
  api_key: ""                    # 直接填密钥（不推荐明文入库）
  api_key_file: config/api.txt   # 密钥文件（已 gitignore；api_key 优先于本文件）
  base_url: https://open.bigmodel.cn/api/coding/paas/v4/   # 智谱编程套餐端点（OpenAI 兼容）
  model: glm-5.3                 # 旗舰模型；低延迟备选 glm-5.3-flash（实测 2.0s）
  timeout_seconds: 20            # 单次调用超时，超时自动降级关键词模式
  thinking: disabled             # GLM 4.5+ 专用：关闭深度思考降延迟（开→11.8s，关→2.4s）

polling:
  news_interval_seconds: 30
  market_interval_seconds: 5
